# Prueba barata antes de intentar compilar Ocarina of Time en GitHub Actions:
# mide cuánto disco libre queda en los runners macOS después de borrar lo que el build no usa.
# OoT necesita unos 60-80 GB libres (dump ~26 GB + RomFS.img extraído ~26 GB + shaders + IPA).
# No descarga ningún juego ni usa secretos. Tarda 2-5 minutos por runner.
name: disk-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disk:
    strategy:
      fail-fast: false
      matrix:
        runner: [xcode-27, macos-latest]   # xcode-27 es la imagen que usa el CI de tu fork (Xcode 27.2)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Equipo y disco antes de limpiar
        run: |
          sw_vers; uname -m; sysctl -n hw.memsize | awk '{printf "RAM: %.1f GB\n", $1/1073741824}'
          ls -d /Applications/Xcode*.app || true
          df -h /
      - name: Borrar Xcodes que no son 27.2, simuladores y otras herramientas
        run: |
          for x in /Applications/Xcode*.app; do
            case "$x" in */Xcode_27.2.app) ;; *) [ -L "$x" ] || sudo rm -rf "$x" ;; esac
          done
          xcrun simctl delete all 2>/dev/null || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* \
                      ~/Library/Developer/CoreSimulator \
                      ~/Library/Android "$ANDROID_HOME" \
                      ~/.ghcup /usr/local/lib/node_modules \
                      /Users/runner/hostedtoolcache/{CodeQL,go,PyPy,Ruby,node} 2>/dev/null || true
      - name: Disco después de limpiar
        run: |
          df -h /
          free=$(df -g / | awk 'NR==2{print $4}')
          echo "### ${{ matrix.runner }}: ${free} GB libres tras limpiar" >> "$GITHUB_STEP_SUMMARY"
          if [ "$free" -lt 70 ]; then
            echo "::warning::Solo ${free} GB libres: probablemente no alcanza para Ocarina of Time (~70 GB)."
          fi
